<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#243f37">
  <title>Paper SA · 文献研究工作台</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/reader.css">
  <link rel="stylesheet" href="/workspace.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#library"><span class="brand-symbol">p<span>·</span></span><span>paper<span class="brand-light">sa</span><small>RESEARCH, CONNECTED.</small></span></a>
      <div class="workspace-label">个人研究空间 <span>LOCAL</span></div>
      <nav aria-label="主导航">
        <button data-view="library" class="nav-item active"><span data-icon="library"></span>文献工作台<span id="nav-count" class="nav-count">0</span></button>
        <button data-view="graph" class="nav-item"><span data-icon="network"></span>文献脉络</button>
        <button data-view="notes" class="nav-item"><span data-icon="note"></span>笔记与报告</button>
        <button data-view="jobs" class="nav-item"><span data-icon="activity"></span>任务中心<span id="job-count" class="activity-dot" hidden></span></button>
      </nav>
      <div class="sidebar-guide"><div class="small-orbit">✳</div><strong>从一篇，走向一个领域</strong><p>发现相关文献，连接研究线索，<br>让每一次阅读都有迹可循。</p><button class="text-button" data-action="show-guide">了解研究流程 <span>↗</span></button></div>
      <div class="sidebar-bottom"><button class="nav-item" data-view="settings"><span data-icon="settings"></span>模型与设置</button><div class="local-status"><span></span>本地存储 · 数据由你掌握<small>Paper SA / v0.1.0</small></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">工作空间 <span>/</span> <b id="breadcrumb">文献工作台</b></div><div class="topbar-right"><span class="provider-status" id="provider-status">未配置模型</span><button class="avatar" data-view="settings" aria-label="打开设置">R</button></div></header>
      <div id="workspace-stale" class="notice workspace-stale" role="alert" hidden>工作目录或服务会话已更改，此页面已暂停请求。请复制备份未保存的草稿后刷新；不会将本页内容写入新目录。</div>
      <main id="main" tabindex="-1"><div class="loading-screen">正在打开你的研究空间…</div></main>
      <footer class="app-footer"><span>更少的整理，更多的发现。</span><span>LOCAL-FIRST RESEARCH WORKSPACE</span></footer>
    </div>
  </div>
  <div id="toast-region" role="status" aria-live="polite"></div>
  <div id="chat-selection-toolbar" class="chat-selection-toolbar" role="toolbar" aria-label="对话摘录工具" hidden>
    <button type="button" class="primary" data-action="save-selection"><span data-icon="note"></span>添加选中文字到笔记</button>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <input id="pdf-upload" type="file" accept="application/pdf,.pdf" hidden>
</body>
</html>
