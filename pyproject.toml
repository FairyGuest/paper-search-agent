[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "paper-sa"
version = "0.1.0"
description = "A local-first medical literature research workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pydantic>=2.10,<3", "platformdirs>=4.3,<5", "cryptography>=44,<48",
  "pypdf>=6.1,<7", "python-multipart>=0.0.20,<1", "defusedxml>=0.7,<1",
  "python-docx>=1.1,<2", "reportlab>=4.3,<5", "markdown-it-py>=3,<5",
  "beautifulsoup4>=4.13,<5", "playwright>=1.51,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]

[project.scripts]
paper-sa = "paper_sa.cli:main"

[tool.hatch.build]
artifacts = ["src/paper_sa/static/vendor/pdfjs/legacy/build/*.mjs"]

[tool.hatch.build.targets.wheel]
packages = ["src/paper_sa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

